services:
  mysql:
    image: mysql:8
    container_name: task_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_system
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_PASSWORD: secret123
      MYSQL_USER: task_user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: task_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - task_network

  backend:
    build: ./backend
    container_name: task_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=task_system
      - DB_USERNAME=task_user
      - DB_PASSWORD=secret123
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - task_network

  worker-high:
    build: ./backend
    container_name: task_worker_high
    restart: unless-stopped
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=task_system
      - DB_USERNAME=task_user
      - DB_PASSWORD=secret123
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
      - mysql
    networks:
      - task_network
    command: php artisan queue:work redis --queue=high --tries=3 --sleep=3

  worker-default:
    build: ./backend
    container_name: task_worker_default
    restart: unless-stopped
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=task_system
      - DB_USERNAME=task_user
      - DB_PASSWORD=secret123
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
      - mysql
    networks:
      - task_network
    command: php artisan queue:work redis --queue=default --tries=3 --sleep=3

  frontend:
    build: ./frontend
    container_name: task_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - task_network

networks:
  task_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
